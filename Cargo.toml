[workspace]
resolver = "2"
members = ["crates/flvstx-core", "crates/flvstx-ipc", "crates/flvstx-cli", "crates/flvstx-plugin", "xtask"]
exclude = ["vendor/nih-plug"]

[workspace.package]
edition = "2021"
version = "1.3.0"
license = "GPL-3.0-or-later"
authors = ["vigneshaiml@gmail.com"]

[workspace.dependencies]
# Vendored nih-plug (vendor/nih-plug) with host-initiated GUI resizing implemented (CLAP/VST3/standalone).
nih_plug = { path = "vendor/nih-plug", features = ["assert_process_allocs"] }
nih_plug_egui = { path = "vendor/nih-plug/nih_plug_egui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midly = "0.5"
arc-swap = "1"
rand = "0.9"
rand_chacha = "0.9"
tungstenite = "0.26"
anyhow = "1"
thiserror = "2"

[profile.release]
lto = false
strip = false
