name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Install the composer's dependencies
        run: npm ci
        working-directory: agent
      - name: Build and package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $zip = "dist/Tonefold-$version.zip"
          if (-not (Test-Path $zip)) { throw "$zip was not produced" }
          $notes = (Get-Content CHANGELOG.md -Raw) -split "(?m)^## " | Where-Object { $_ -like "$version*" } | Select-Object -First 1
          $notes = ($notes -split "`n", 2)[1]
          Set-Content release-notes.md $notes
          gh release create "${{ github.ref_name }}" $zip --title "Tonefold $version" --notes-file release-notes.md
